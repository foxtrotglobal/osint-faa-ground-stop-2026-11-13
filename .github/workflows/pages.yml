name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages for Actions
        continue-on-error: true
        run: |
          curl -sS -o /tmp/pages-post.json -w "POST %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}' || true
          curl -sS -o /tmp/pages-put.json -w "PUT %{http_code}\n" -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}' || true
          cat /tmp/pages-post.json /tmp/pages-put.json || true
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll
          if [ -f faa-ground-stop-2026-11-13.pdf ]; then
            cp faa-ground-stop-2026-11-13.pdf _site/
          elif [ -f faa-ground-stop-2026-11-13.pdf.b64 ]; then
            base64 -d faa-ground-stop-2026-11-13.pdf.b64 > _site/faa-ground-stop-2026-11-13.pdf
          fi
          test -s _site/faa-ground-stop-2026-11-13.pdf
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
